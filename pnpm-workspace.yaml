packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

catalog:
  '@base-ui/react': ^1.7.0
  '@changesets/changelog-github': ^0.7.0
  '@changesets/cli': ^2.31.1
  '@fontsource-variable/inter': ^5.3.0
  '@fontsource-variable/jetbrains-mono': ^5.3.0
  '@storybook/addon-a11y': ^10.5.7
  '@storybook/addon-docs': ^10.5.7
  '@storybook/addon-themes': ^10.5.7
  '@storybook/react-vite': ^10.5.7
  '@tailwindcss/cli': ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  cva: 1.0.0-beta.4
  del-cli: ^7.0.0
  lucide-react: ^1.29.0
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  oxlint-tsgolint: ^7.0.2001
  react: ^19.2.8
  react-dom: ^19.2.8
  sherif: ^1.13.0
  storybook: ^10.5.7
  tailwindcss: ^4.3.3
  turbo: ^2.10.8
  typescript: ^7.0.2
  vite: ^8.2.1

catalogMode: strict

cleanupUnusedCatalogs: true

engineStrict: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver

publicHoistPattern:
  - '*storybook*'
